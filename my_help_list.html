<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Help List | Chamber of Hope HELPS Directory</title><meta name="description" content="Chamber of Hope HELPS Directory information and visitor tools."><link rel="stylesheet" href="site-enhancements-july13-final.css"><script defer src="site-enhancements-july13-final.js"></script></head><body style="margin:0;background:radial-gradient(circle at top left,#fffaf3,#f6efe2);"><div id="coh-global-tools"></div><main class="coh-page">
<section class="coh-card"><h1>My Help List</h1><p>Pages you save are stored only in this browser on this device. Add private notes carefully—anyone with access to the device may be able to see them.</p><div class="coh-btnrow coh-no-print"><a class="coh-btn primary" href="search.html">Search and save pages</a><button class="coh-btn" onclick="window.print()">Print my list</button><button class="coh-btn" id="copy-list">Copy list</button><button class="coh-btn danger" id="clear-list">Clear list</button></div><div id="saved-list" aria-live="polite"></div></section>
<script>
function load(){const host=document.getElementById('saved-list'),items=COH.saved();if(!items.length){host.innerHTML='<div class="coh-note">No pages have been saved yet. Open any directory page and choose <strong>More tools → Save this page</strong>.</div>';return;}host.innerHTML=items.map((x,i)=>`<div class="coh-saved-item" data-i="${i}"><h2 style="margin:0 0 5px"><a href="${COH.esc(x.url)}">${COH.esc(x.title)}</a></h2><small>Saved ${new Date(x.added).toLocaleDateString()}</small><textarea aria-label="Notes for ${COH.esc(x.title)}" placeholder="Optional private note">${COH.esc(x.note||'')}</textarea><div class="coh-btnrow coh-no-print"><a class="coh-btn" href="${COH.esc(x.url)}">Open</a><button class="coh-btn save-note">Save note</button><button class="coh-btn danger remove">Remove</button></div></div>`).join('');document.querySelectorAll('.save-note').forEach(b=>b.onclick=()=>{const box=b.closest('.coh-saved-item'),i=+box.dataset.i,arr=COH.saved();arr[i].note=box.querySelector('textarea').value;localStorage.setItem('cohSavedPages',JSON.stringify(arr));COH.toast('Note saved on this device.');});document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{const i=+b.closest('.coh-saved-item').dataset.i,arr=COH.saved();arr.splice(i,1);localStorage.setItem('cohSavedPages',JSON.stringify(arr));load();});}
document.getElementById('clear-list').onclick=()=>{if(confirm('Clear every saved page and note from this browser?')){localStorage.removeItem('cohSavedPages');load();}};document.getElementById('copy-list').onclick=async()=>{const text=COH.saved().map((x,i)=>`${i+1}. ${x.title}\n${x.url}${x.note?'\nNote: '+x.note:''}`).join('\n\n');if(!text){COH.toast('There is nothing to copy.');return;}try{await navigator.clipboard.writeText(text);COH.toast('Help list copied.')}catch(e){COH.toast('Copy was blocked by the browser.')}};load();
</script>
</main><div id="coh-global-footer"></div></body></html>
